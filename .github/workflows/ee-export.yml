name: Weekly Sentinel-2 NDVI Export

on:
  schedule:
    - cron: "0 6 * * 0"   # Every Sunday at 06:00 UTC (11:30 AM IST)
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run export.py
        env:
          EE_SA_KEY: "${{ secrets.EE_SA_KEY }}"
          EE_SA_EMAIL: "${{ secrets.EE_SA_EMAIL }}"
          EXPORT_FOLDER_ID: "${{ secrets.EXPORT_FOLDER_ID }}"
          EXPORT_FOLDER: "EarthEngineExports"
        run: |
          for i in {1..3}; do
            python export.py && break
            echo "Attempt $i failed, waiting 60s for API propagation..."
            sleep 60
          done

      - name: Remove service-account file if present (cleanup)
        run: |
          if [ -f sa-key.json ]; then
            shred -u sa-key.json || rm -f sa-key.json
          fi

      - name: Commit updated CSVs (only if changed) and push
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # Stage CSV files if any exist (don't fail if none)
          git add data/*.csv || true

          # If no staged changes, exit gracefully
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
            exit 0
          fi

          git commit -m "Weekly Sentinel-2 NDVI update: $(date -u +'%Y-%m-%d')"

          # Push using token via HTTPS (ensures proper auth even if repo permissions strict)
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:"${BRANCH}"
